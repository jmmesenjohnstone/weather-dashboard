<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>63045 Weather Forecast</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #ffffff;
    color: #243447;
    font-family: Arial, Helvetica, sans-serif;
}

.weather-card {
    width: 100%;
    padding: 14px 16px;
}

/* ---------- HEADER ---------- */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 11px;
}

.title {
    font-size: 19px;
    font-weight: 700;
    color: #1f4e79;
    letter-spacing: .2px;
}

.subtitle {
    font-size: 11px;
    color: #71808c;
    margin-top: 3px;
}

.updated {
    font-size: 9px;
    color: #9aa5ad;
    text-align: right;
}

/* ---------- FORECAST ---------- */

.forecast {
    display: grid;
    grid-template-columns: 1.25fr repeat(6, 1fr);
    gap: 6px;
}

.day {
    text-align: center;
    background: #f4f7f9;
    border-radius: 7px;
    padding: 8px 3px;
    min-width: 0;
    border: 1px solid #edf1f3;
}

/* ---------- TODAY ---------- */

.day.today {
    background: linear-gradient(145deg, #1f6fae, #2f87c5);
    color: white;
    border: none;
    box-shadow: 0 2px 5px rgba(31, 78, 121, .25);
}

.day.today .day-name,
.day.today .date,
.day.today .low,
.day.today .condition {
    color: rgba(255,255,255,.88);
}

.day.today .high {
    color: #ffffff;
}

.day.today .rain {
    color: #e4f5ff;
}

.day.today .icon {
    font-size: 34px;
    line-height: 40px;
}

/* ---------- TEXT ---------- */

.day-name {
    font-size: 11px;
    font-weight: 700;
    color: #34495e;
}

.date {
    font-size: 9px;
    color: #8493a0;
    margin-top: 2px;
}

.icon {
    font-size: 27px;
    line-height: 36px;
    margin: 3px 0;
}

.high {
    font-size: 17px;
    font-weight: 700;
    color: #d35400;
}

.low {
    font-size: 12px;
    color: #52758a;
    margin-top: 1px;
}

.rain {
    font-size: 10px;
    color: #2878a8;
    margin-top: 5px;
    font-weight: 600;
}

.condition {
    font-size: 8px;
    color: #687985;
    margin-top: 3px;
    min-height: 20px;
}

/* ---------- SMALL SCREENS ---------- */

@media (max-width: 700px) {

    .weather-card {
        padding: 10px;
    }

    .title {
        font-size: 16px;
    }

    .forecast {
        grid-template-columns: repeat(4, 1fr);
    }

    .day.today {
        grid-column: span 1;
    }
}

/* ---------- VERY SMALL ---------- */

@media (max-width: 450px) {

    .forecast {
        grid-template-columns: repeat(2, 1fr);
    }

    .updated {
        display: none;
    }
}
</style>
</head>

<body>

<div class="weather-card">

    <div class="header">

        <div>
            <div class="title">
                7-DAY WEATHER FORECAST
            </div>

            <div class="subtitle">
                Earth City, MO 63045
            </div>
        </div>

        <div class="updated" id="updated">
            Loading...
        </div>

    </div>

    <div class="forecast" id="forecast">

        <div class="day">
            Loading forecast...
        </div>

    </div>

</div>


<script>

function weatherIcon(icon) {

    const icons = {

        "clear-day": "☀️",
        "clear-night": "🌙",

        "partly-cloudy-day": "🌤️",
        "partly-cloudy-night": "🌙",

        "cloudy": "☁️",

        "rain": "🌧️",

        "showers-day": "🌦️",
        "showers-night": "🌧️",

        "thunder-rain": "⛈️",
        "thunder-showers-day": "⛈️",
        "thunder-showers-night": "⛈️",

        "snow": "❄️",
        "snow-showers-day": "🌨️",
        "snow-showers-night": "🌨️",

        "fog": "🌫️",

        "wind": "💨"
    };

    return icons[icon] || "🌤️";
}


function formatDay(dateString, index) {

    const date = new Date(dateString + "T12:00:00");

    if (index === 0) {
        return "TODAY";
    }

    return date.toLocaleDateString("en-US", {
        weekday: "short"
    });
}


function formatDate(dateString) {

    const date = new Date(dateString + "T12:00:00");

    return date.toLocaleDateString("en-US", {
        month: "numeric",
        day: "numeric"
    });
}


async function loadForecast() {

    try {

        const response =
            await fetch("forecast.json?t=" + Date.now());

        if (!response.ok) {
            throw new Error("Could not load forecast");
        }

        const data = await response.json();

        if (!data.days || data.days.length === 0) {
            throw new Error("No forecast data");
        }

        const forecast =
            document.getElementById("forecast");

        forecast.innerHTML = "";

        const days = data.days.slice(0, 7);

        days.forEach((day, index) => {

            const card =
                document.createElement("div");

            card.className =
                "day" + (index === 0 ? " today" : "");

            const high =
                day.tempmax !== undefined
                    ? Math.round(day.tempmax)
                    : "--";

            const low =
                day.tempmin !== undefined
                    ? Math.round(day.tempmin)
                    : "--";

            const rain =
                day.precipprob !== undefined
                    ? Math.round(day.precipprob)
                    : "--";

            card.innerHTML = `

                <div class="day-name">
                    ${formatDay(day.datetime, index)}
                </div>

                <div class="date">
                    ${formatDate(day.datetime)}
                </div>

                <div class="icon">
                    ${weatherIcon(day.icon)}
                </div>

                <div class="high">
                    ${high}°
                </div>

                <div class="low">
                    ${low}°
                </div>

                <div class="rain">
                    💧 ${rain}%
                </div>

                <div class="condition">
                    ${day.conditions || ""}
                </div>

            `;

            forecast.appendChild(card);

        });


        document.getElementById("updated").textContent =
            "Updated " +
            new Date().toLocaleTimeString("en-US", {
                hour: "numeric",
                minute: "2-digit"
            });

    }

    catch (error) {

        document.getElementById("forecast").innerHTML =

            `<div class="day">
                Forecast temporarily unavailable
            </div>`;

        console.error(error);
    }
}


loadForecast();

</script>

</body>
</html>
