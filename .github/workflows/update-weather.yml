name: Update Weather Forecast

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get weather forecast
        env:
          VC_API_KEY: ${{ secrets.VC_API_KEY }}
        run: |
          curl -L "https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/63045?unitGroup=us&include=days&elements=datetime,tempmax,tempmin,precipprob,conditions,icon&key=${VC_API_KEY}&contentType=json" \
            -o forecast.json

      - name: Commit updated forecast
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add forecast.json
          git diff --cached --quiet || git commit -m "Update weather forecast"
          git push
